# StudyScape 生产环境 Nginx 站点配置（修正版）
#
# 部署方式（由运维/部署同学执行）：
#   sudo cp deploy/nginx-studyscape.conf /etc/nginx/sites-available/studyscape
#   sudo nginx -t && sudo systemctl reload nginx
#
# 相对线上旧配置的两处修复：
#   1. /StudyScape/assets/ 下的静态资源缺失时直接返回 404，不再回退 index.html
#      （避免“资源丢失”被伪装成 200 HTML，导致白屏/头像空白且状态码看不出问题）
#   2. SPA 入口 index.html 设置 Cache-Control: no-cache，避免浏览器长期缓存旧入口
#      导致新版本上线后用户仍运行旧前端包

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/StudyScape/public;
    index index.php index.html;

    # ========== API 后端（正则优先级高于普通前缀） ==========
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # ========== SPA 入口：禁止长期缓存 ==========
    location = /StudyScape/index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ========== 静态资源：缺失即 404，绝不回退 index.html ==========
    # 资源文件名带内容哈希，可长期缓存
    location ^~ /StudyScape/assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # ========== SPA 子目录路由 ==========
    location ^~ /StudyScape/ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /StudyScape/index.html;
    }

    # ========== 根路径也 serve SPA ==========
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri /StudyScape/index.html;
    }

    location ~ /\. { deny all; }
}
