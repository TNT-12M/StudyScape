# StudyScape 生产环境 Nginx 站点配置
#
# 部署方式（由运维/部署同学执行）：
#   sudo cp deploy/nginx-studyscape.conf /etc/nginx/sites-available/studyscape
#   sudo nginx -t && sudo systemctl reload nginx
#
# 相比旧配置的修复：
#   1. 按接口分流上传体积：
#        /api.php     普通接口 2MB（登录、资料编辑、头像、二维码等）
#        /upload.php  大文件入口 52MB（题库导入、OCR 识别、资料上传）
#      避免一刀切放开 50MB，也避免 1MB 默认值把正常导入拦掉（413）。
#   2. 大文件入口通过 FastCGI PHP_VALUE 单独放宽 upload_max_filesize / post_max_size，
#      普通接口的 PHP 限制保持不变。
#      若线上 PHP-FPM 池使用了 php_admin_value 导致 PHP_VALUE 被忽略，
#      需在池配置中改为 php_value[upload_max_filesize]=50M、php_value[post_max_size]=52M。
#   3. 413 返回结构化 JSON，前端可直接展示中文提示。
#   4. /StudyScape/assets/ 缺失返回 404，不再回退 index.html。
#   5. index.html 与 SPA 路由加 Cache-Control: no-cache，避免长期跑旧包。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/StudyScape/public;
    index index.php index.html;

    # 默认所有请求 2MB：覆盖普通接口与静态页面
    client_max_body_size 2m;

    # 413 统一返回 JSON（保留 413 状态码）
    error_page 413 /413.json;
    location = /413.json {
        internal;
        default_type application/json;
    }

    # ========== 普通 API：2MB ==========
    location = /api.php {
        client_max_body_size 2m;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # ========== 大文件入口：52MB（题库 / OCR / 资料） ==========
    location = /upload.php {
        client_max_body_size 52m;
        client_body_timeout 180s;
        fastcgi_read_timeout 600s;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PHP_VALUE "upload_max_filesize=50M\npost_max_size=52M\nmemory_limit=256M\nmax_execution_time=600";
        include fastcgi_params;
    }

    # 其它 PHP 文件（如有）沿用 2MB
    location ~ \.php$ {
        client_max_body_size 2m;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # ========== SPA 入口：禁止长期缓存 ==========
    location = /StudyScape/index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ========== 静态资源：缺失即 404，绝不回退 index.html ==========
    location ^~ /StudyScape/assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # ========== SPA 子目录路由 ==========
    location ^~ /StudyScape/ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /StudyScape/index.html;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri /StudyScape/index.html;
    }

    location ~ /\. { deny all; }
}
