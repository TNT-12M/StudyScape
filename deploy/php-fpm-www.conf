; ============================================================
; StudyScape PHP-FPM pool 建议配置
; 目标机器: yaoniang (103.79.186.6) — 2核 CPU / 2GB RAM
; 路径: /etc/php/8.3/fpm/pool.d/www.conf
; ============================================================
; 部署步骤:
;   1. sudo cp deploy/php-fpm-www.conf /etc/php/8.3/fpm/pool.d/www.conf
;   2. sudo systemctl restart php8.3-fpm
;   3. 验证: sudo systemctl status php8.3-fpm
;          sudo tail -f /var/log/php8.3-fpm.log
; ============================================================

[www]

; ============ 基础身份 ============
user = www-data
group = www-data
listen = /run/php/php8.3-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; ============ 进程管理 (dynamic 模式) ============
; 2C/2GB 机器公式: max_children ≈ RAM/50MB = 2048/50 ≈ 40
; 但 SQLite 单写锁 + 低并发场景, 保守 15-20 足够
pm = dynamic
pm.max_children = 16
pm.start_servers = 6
pm.min_spare_servers = 3
pm.max_spare_servers = 10

; 防内存泄漏: 每个 worker 处理 500 请求后自动重启
pm.max_requests = 500
pm.process_idle_timeout = 10s

; ============ 超时保护 ============
; 防止慢请求阻塞 worker (SQLite busy_timeout=30s, 这里留 buffer)
request_terminate_timeout = 45s
request_slowlog_timeout = 5s
slowlog = /var/log/php8.3-fpm-slow.log

; ============ 资源限制 ============
; 2GB 机器, 每个 worker ≈ 30-40MB, 16 个 ≈ 600MB, 给 nginx/system 留足
memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 60
max_input_time = 60

; ============ OpCache (FPM 模式必须开) ============
; 注意: 这些 php_flag 在 pool 级覆盖 php.ini 同配置
php_flag[opcache.enable] = on
php_flag[opcache.enable_cli] = off
php_value[opcache.memory_consumption] = 256
php_value[opcache.interned_strings_buffer] = 16
php_value[opcache.max_accelerated_files] = 40000
php_value[opcache.revalidate_freq] = 60
php_flag[opcache.validate_timestamps] = on
php_flag[opcache.save_comments] = on

; ============ 日志 ============
access.log = /var/log/php8.3-fpm-access.log
access.format = "%t %m \"%R\" %s %{mili}dms %{kilo}MMB %CPU%%"

; ============ 环境变量 ============
env[HOSTNAME] = $HOSTNAME
env[PATH] = /usr/local/bin:/usr/bin:/bin
env[TMP] = /tmp
env[TMPDIR] = /tmp
env[TEMP] = /tmp
