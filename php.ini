; 学补·在线刷题平台 专用 PHP 配置 (Windows)
; 启动时用: php -c php.ini -S 127.0.0.1:8080 -t 项目目录

[PHP]
; ---- 路径 ----
extension_dir = "D:\php-8.5.9\ext"

; ---- 错误显示（本地测试开启；上线前改为 Off）----
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = "c:\Users\Administrator\Desktop\StudyScape\data\php_error.log"

; ---- 执行时间与内存 ----
max_execution_time = 180
max_input_time = 120
memory_limit = 512M

; ---- POST / 上传 ----
post_max_size = 128M
upload_max_filesize = 64M
max_file_uploads = 20

; ---- Session ----
session.save_handler = files
session.save_path = "c:\Users\Administrator\Desktop\StudyScape\tmp_sessions"
session.use_cookies = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.gc_maxlifetime = 14400

; ---- 扩展：项目核心必需 ----
extension = php_sqlite3.dll
extension = php_pdo_sqlite.dll
extension = php_gd.dll
extension = php_fileinfo.dll
extension = php_curl.dll
extension = php_openssl.dll
extension = php_mbstring.dll
extension = php_zip.dll
extension = php_exif.dll

; ---- 扩展：可选（文档导入/未来使用）----
extension = php_ftp.dll
extension = php_sockets.dll
extension = php_soap.dll

; ---- 字符集 ----
default_charset = "UTF-8"
internal_encoding = "UTF-8"
output_encoding = "UTF-8"

; ---- 时区 ----
date.timezone = Asia/Shanghai
